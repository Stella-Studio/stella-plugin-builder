name: build-bhveinminer-hotfix1

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified merged source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          cat \
            bhvm_payload/part00 \
            bhvm_payload/part01 \
            bhvm_payload/part02 \
            bhvm_payload/part03 \
            bhvm_payload/rem00 \
            bhvm_fix/rem01_0 \
            bhvm_fix/rem01_1 \
            bhvm_fix/rem01_2 \
            bhvm_payload/rem02 > work/source.b64
          head -c 12000 bhvm_payload/rem03 >> work/source.b64
          cat \
            bhvm_payload/rem04 \
            bhvm_payload/rem05 \
            bhvm_payload/rem06 \
            bhvm_payload/rem07 \
            bhvm_fix/rem08_0 \
            bhvm_fix/rem08_1 \
            bhvm_fix/rem08_2 \
            bhvm_fix/rem09_0 \
            bhvm_fix/rem09_1 \
            bhvm_fix/rem09_2 >> work/source.b64
          base64 -d work/source.b64 > work/source.zip
          echo 'bb53794a3c3588e4c9224001cebd6038eed8925c16a4615d05ec6242ab3993ac  work/source.zip' | sha256sum -c -
          mkdir -p work/project
          unzip -q work/source.zip -d work/project
          test -f work/project/build.gradle.kts

      - name: Apply hotfix1 deterministically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('work/project')

          def replace(path, old, new):
              p = root / path
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing expected text in {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new))

          replace('build.gradle.kts', 'version = "1.0.0-rc.4-merged"', 'version = "1.0.0-rc.4-merged-hotfix1"')
          replace('src/main/resources/config.yml', '  # If a detected protection plugin hook cannot bind/query, deny VeinMiner instead of risking claim bypass.\n  protection-fail-closed: true', '  # If a protection hook cannot bind/query, fall back to real BlockBreakEvent + BFS parent barrier.\n  # This avoids globally disabling VeinMiner when WG/GP changes an API signature.\n  protection-fail-closed: false')

          p = root / 'src/main/resources/plugin.yml'
          s = p.read_text()
          for old, new in {
              '  bhveinminer.use:\n    default: false': '  bhveinminer.use:\n    default: true',
              '  bhveinminer.gui:\n    default: false': '  bhveinminer.gui:\n    default: true',
              '  bhveinminer.toggle:\n    default: false': '  bhveinminer.toggle:\n    default: true',
              '  bhveinminer.mode:\n    default: false': '  bhveinminer.mode:\n    default: true',
              '  bhveinminer.preview:\n    default: false': '  bhveinminer.preview:\n    default: true',
              '  bhveinminer.cancel:\n    default: false': '  bhveinminer.cancel:\n    default: true',
              '  bhveinminer.category.pickaxe:\n    default: false': '  bhveinminer.category.pickaxe:\n    default: true',
              '  bhveinminer.activation.sneak:\n    default: false': '  bhveinminer.activation.sneak:\n    default: true',
              '  bhveinminer.drop.normal:\n    default: false': '  bhveinminer.drop.normal:\n    default: true',
          }.items():
              if old not in s: raise SystemExit(f'missing plugin permission block: {old}')
              s = s.replace(old, new)
          p.write_text(s)

          replace('src/main/resources/categories.yml', "    tools:\n      - '#minecraft:pickaxes'", "    tools:\n      - '#minecraft:pickaxes'\n      # Exact fallbacks in case a fork/datapack does not expose the vanilla item tag through Bukkit#getTag.\n      - minecraft:wooden_pickaxe\n      - minecraft:stone_pickaxe\n      - minecraft:iron_pickaxe\n      - minecraft:golden_pickaxe\n      - minecraft:diamond_pickaxe\n      - minecraft:netherite_pickaxe")

          replace('src/main/java/net/breakhood/bhveinminer/config/ConfigManager.java', '''    public boolean canUseActivationMode(Player player, ActivationMode mode) {\n        if (mode == ActivationMode.OFF) return true;\n        return player.hasPermission("bhveinminer.activation." + mode.name().toLowerCase(Locale.ROOT));\n    }''', '''    public boolean canUseActivationMode(Player player, ActivationMode mode) {\n        if (mode == ActivationMode.OFF) return true;\n        if (mode == ActivationMode.SNEAK && player.hasPermission("bhveinminer.use")) return true;\n        return player.hasPermission("bhveinminer.activation." + mode.name().toLowerCase(Locale.ROOT));\n    }''')

          replace('src/main/java/net/breakhood/bhveinminer/config/ConfigManager.java', '''        if (mode == null) return false;\n        String node = switch (mode) {''', '''        if (mode == null) return false;\n        if (mode == DropMode.NORMAL && player.hasPermission("bhveinminer.use")) return true;\n        String node = switch (mode) {''')

          replace('src/main/java/net/breakhood/bhveinminer/command/BHVeinMinerCommand.java', '''        player.sendMessage(Text.mm("<gray> • Session: <white>" + plugin.miningService().hasSession(player.getUniqueId())));\n        player.sendMessage(Text.mm("<gray> • Tổng vein/block: <white>" + profile.totalVeins() + " / " + profile.totalBlocks()));''', '''        player.sendMessage(Text.mm("<gray> • Session: <white>" + plugin.miningService().hasSession(player.getUniqueId())));\n        player.sendMessage(Text.mm("<gray> • Perm use/pickaxe/sneak: <white>"\n                + player.hasPermission("bhveinminer.use") + " / "\n                + player.hasPermission("bhveinminer.category.pickaxe") + " / "\n                + player.hasPermission("bhveinminer.activation.sneak")));\n        player.sendMessage(Text.mm("<gray> • Rank cap: <white>" + plugin.configManager().permissionLimit(player)));\n        player.sendMessage(Text.mm("<gray> • Protection hooks: <white>" + String.join(", ", plugin.compatibilityManager().activeProtectionHooks())));\n        player.sendMessage(Text.mm("<gray> • Hook lỗi: <white>" + (plugin.compatibilityManager().failedProtectionHooks().isEmpty()\n                ? "none" : String.join(", ", plugin.compatibilityManager().failedProtectionHooks()))));\n        player.sendMessage(Text.mm("<gray> • Tổng vein/block: <white>" + profile.totalVeins() + " / " + profile.totalBlocks()));''')

          p = root / 'src/main/resources/messages.yml'
          s = p.read_text()
          if 'hold-sneak:' not in s:
              s += "\nhold-sneak: '<prefix><yellow>Giữ <white>Shift</white> khi phá quặng để kích hoạt VeinMiner.'\n"
          p.write_text(s)
          PY
          grep -q '1.0.0-rc.4-merged-hotfix1' work/project/build.gradle.kts
          grep -q 'protection-fail-closed: false' work/project/src/main/resources/config.yml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Validate configs
        working-directory: work/project
        run: python3 scripts/validate_config.py

      - name: Build BHVeinMiner hotfix1
        working-directory: work/project
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify compiled jar
        shell: bash
        run: |
          set -euo pipefail
          jar_file=$(find work/project/build/libs -maxdepth 1 -type f -name 'BHVeinMiner-*.jar' | head -1)
          test -n "$jar_file"
          mkdir -p out
          cp "$jar_file" out/BHVeinMiner-1.0.0-rc.4-merged-hotfix1.jar
          jar tf out/BHVeinMiner-1.0.0-rc.4-merged-hotfix1.jar | grep -q '^plugin.yml$'
          jar tf out/BHVeinMiner-1.0.0-rc.4-merged-hotfix1.jar | grep -q '^net/breakhood/bhveinminer/BHVeinMinerPlugin.class$'
          sha256sum out/BHVeinMiner-1.0.0-rc.4-merged-hotfix1.jar

      - uses: actions/upload-artifact@v4
        with:
          name: BHVeinMiner-1.0.0-rc.4-merged-hotfix1
          path: out/BHVeinMiner-1.0.0-rc.4-merged-hotfix1.jar
          retention-days: 1
          if-no-files-found: error
