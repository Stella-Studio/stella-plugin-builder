name: build-bhveinminer-merged

on:
  push:
    branches:
      - build/bhveinminer-rc4-merged-20260821
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified merged source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          cat \
            bhvm_payload/part00 \
            bhvm_payload/part01 \
            bhvm_payload/part02 \
            bhvm_payload/part03 \
            bhvm_payload/rem00 \
            bhvm_fix/rem01_0 \
            bhvm_fix/rem01_1 \
            bhvm_fix/rem01_2 \
            bhvm_payload/rem02 > work/source.b64
          head -c 12000 bhvm_payload/rem03 >> work/source.b64
          cat \
            bhvm_payload/rem04 \
            bhvm_payload/rem05 \
            bhvm_payload/rem06 \
            bhvm_payload/rem07 \
            bhvm_fix/rem08_0 \
            bhvm_fix/rem08_1 \
            bhvm_fix/rem08_2 \
            bhvm_fix/rem09_0 \
            bhvm_fix/rem09_1 \
            bhvm_fix/rem09_2 >> work/source.b64
          base64 -d work/source.b64 > work/source.zip
          echo 'bb53794a3c3588e4c9224001cebd6038eed8925c16a4615d05ec6242ab3993ac  work/source.zip' | sha256sum -c -
          mkdir -p work/project
          unzip -q work/source.zip -d work/project
          test -f work/project/build.gradle.kts
          test -f work/project/src/main/resources/plugin.yml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build BHVeinMiner
        working-directory: work/project
        run: gradle clean build --no-daemon --stacktrace

      - name: Verify compiled jar
        shell: bash
        run: |
          set -euo pipefail
          ls -lah work/project/build/libs
          jar_file=$(find work/project/build/libs -maxdepth 1 -type f -name 'BHVeinMiner-*.jar' | head -1)
          test -n "$jar_file"
          mkdir -p out
          cp "$jar_file" out/BHVeinMiner-1.0.0-rc.4-merged.jar
          jar tf out/BHVeinMiner-1.0.0-rc.4-merged.jar | grep -q '^plugin.yml$'
          jar tf out/BHVeinMiner-1.0.0-rc.4-merged.jar | grep -q '^net/breakhood/bhveinminer/BHVeinMinerPlugin.class$'
          sha256sum out/BHVeinMiner-1.0.0-rc.4-merged.jar

      - uses: actions/upload-artifact@v4
        with:
          name: BHVeinMiner-1.0.0-rc.4-merged
          path: out/BHVeinMiner-1.0.0-rc.4-merged.jar
          retention-days: 1
          if-no-files-found: error
